<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="0.5" cy="0.5" r="0.8" fill="#1c1c1c"/>
    </pattern>
    <linearGradient id="nameGrad" x1="56" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="#0a0a0a"/>
  <rect width="1200" height="340" fill="url(#dots)"/>

  <!-- Left cyan edge accent -->
  <rect x="0" y="0" width="2" height="340" fill="#00b4d8" opacity="0.35"/>

  <!-- Top-right status tag -->
  <circle cx="1112" cy="22" r="3" fill="#22c55e" opacity="0.85"/>
  <text x="1122" y="26"
    font-family="'Inter',-apple-system,system-ui,sans-serif"
    font-size="10" letter-spacing="2.5" fill="#374151">ONLINE</text>
  <text x="1192" y="26" text-anchor="end"
    font-family="'Inter',-apple-system,system-ui,sans-serif"
    font-size="10" letter-spacing="1.5" fill="#f59e0b" opacity="0.4">v2025.1</text>

  <!-- ASCII art name — 6 lines, font-size 13, baseline-to-baseline 16px -->
  <text x="56" y="130" font-family="'Courier New',Courier,monospace" font-size="13" fill="url(#nameGrad)" xml:space="preserve"> █████╗  █████╗ ██████╗ ██╗████████╗    ██████╗  █████╗ ███╗   ██╗██╗</text>
  <text x="56" y="146" font-family="'Courier New',Courier,monospace" font-size="13" fill="url(#nameGrad)" xml:space="preserve">██╔══██╗██╔══██╗██╔══██╗██║╚══██╔══╝    ██╔══██╗██╔══██╗████╗  ██║██║</text>
  <text x="56" y="162" font-family="'Courier New',Courier,monospace" font-size="13" fill="url(#nameGrad)" xml:space="preserve">███████║███████║██║  ██║██║   ██║       ██████╔╝███████║██╔██╗ ██║██║</text>
  <text x="56" y="178" font-family="'Courier New',Courier,monospace" font-size="13" fill="url(#nameGrad)" xml:space="preserve">██╔══██║██╔══██║██║  ██║██║   ██║       ██╔═══╝ ██╔══██║██║╚██╗██║██║</text>
  <text x="56" y="194" font-family="'Courier New',Courier,monospace" font-size="13" fill="url(#nameGrad)" xml:space="preserve">██║  ██║██║  ██║██████╔╝██║   ██║       ██║     ██║  ██║██║ ╚████║██║</text>
  <text x="56" y="210" font-family="'Courier New',Courier,monospace" font-size="13" fill="url(#nameGrad)" xml:space="preserve">╚═╝  ╚═╝╚═╝  ╚═╝╚═════╝ ╚═╝   ╚═╝       ╚═╝     ╚═╝  ╚═╝╚═╝  ╚═══╝╚═╝</text>

  <!-- Thin rule below name -->
  <line x1="56" y1="222" x2="610" y2="222" stroke="#222" stroke-width="1"/>

  <!-- Rotating phrases (cross-fade, 12s cycle) -->
  <text x="60" y="245" opacity="0"
    font-family="'Inter',-apple-system,system-ui,sans-serif"
    font-size="15" letter-spacing="0.4" fill="#00b4d8">
    adaptive AI systems engineer
    <animate attributeName="opacity"
      values="0;1;1;0;0"
      keyTimes="0;0.042;0.292;0.333;1"
      dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="60" y="245" opacity="0"
    font-family="'Inter',-apple-system,system-ui,sans-serif"
    font-size="15" letter-spacing="0.4" fill="#00b4d8">
    building intelligent infrastructure
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.333;0.375;0.625;0.667;1"
      dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="60" y="245" opacity="0"
    font-family="'Inter',-apple-system,system-ui,sans-serif"
    font-size="15" letter-spacing="0.4" fill="#00b4d8">
    edge inference architect
    <animate attributeName="opacity"
      values="0;0;0;1;1;0"
      keyTimes="0;0.667;0.708;0.958;1"
      dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- Blinking cursor -->
  <text x="388" y="245"
    font-family="'Inter',-apple-system,system-ui,sans-serif"
    font-size="15" fill="#00b4d8">▋
    <animate attributeName="opacity"
      values="1;1;0;0;1"
      keyTimes="0;0.45;0.5;0.95;1"
      dur="1s" repeatCount="indefinite"/>
  </text>

  <!-- Context / subtitle line -->
  <text x="60" y="276"
    font-family="'Inter',-apple-system,system-ui,sans-serif"
    font-size="10.5" letter-spacing="2.8" fill="#2a3040">
    RVU · BENGALURU · EDGE AI · AUTONOMOUS SYSTEMS
  </text>

  <!-- Right side: live signal bars (bottom-pinned at y=270) -->
  <rect x="870" y="250" width="7" height="20" rx="2" fill="#162116">
    <animate attributeName="y"      values="250;246;252;250" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="height" values="20;24;18;20"     dur="1.8s" repeatCount="indefinite"/>
  </rect>

  <rect x="884" y="238" width="7" height="32" rx="2" fill="#22c55e" opacity="0.18">
    <animate attributeName="y"      values="238;233;241;238" dur="2.1s" repeatCount="indefinite"/>
    <animate attributeName="height" values="32;37;29;32"     dur="2.1s" repeatCount="indefinite"/>
  </rect>

  <rect x="898" y="225" width="7" height="45" rx="2" fill="#22c55e" opacity="0.26">
    <animate attributeName="y"      values="225;219;228;225" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="height" values="45;51;42;45"     dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
  </rect>

  <rect x="912" y="210" width="7" height="60" rx="2" fill="#00b4d8" opacity="0.32">
    <animate attributeName="y"      values="210;204;214;210" dur="2.4s" begin="0.1s" repeatCount="indefinite"/>
    <animate attributeName="height" values="60;66;56;60"     dur="2.4s" begin="0.1s" repeatCount="indefinite"/>
  </rect>

  <rect x="926" y="205" width="7" height="65" rx="2" fill="#00b4d8" opacity="0.42">
    <animate attributeName="y"      values="205;198;210;205" dur="1.9s" repeatCount="indefinite"/>
    <animate attributeName="height" values="65;72;60;65"     dur="1.9s" repeatCount="indefinite"/>
  </rect>

  <rect x="940" y="216" width="7" height="54" rx="2" fill="#00b4d8" opacity="0.28">
    <animate attributeName="y"      values="216;210;220;216" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="height" values="54;60;50;54"     dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
  </rect>

  <rect x="954" y="230" width="7" height="40" rx="2" fill="#22c55e" opacity="0.22">
    <animate attributeName="y"      values="230;225;234;230" dur="1.7s" begin="0.15s" repeatCount="indefinite"/>
    <animate attributeName="height" values="40;45;36;40"     dur="1.7s" begin="0.15s" repeatCount="indefinite"/>
  </rect>

  <rect x="968" y="246" width="7" height="24" rx="2" fill="#162116">
    <animate attributeName="y"      values="246;241;249;246" dur="2.0s" begin="0.1s" repeatCount="indefinite"/>
    <animate attributeName="height" values="24;29;21;24"     dur="2.0s" begin="0.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Bar chart ground line + grid ticks -->
  <line x1="864" y1="270" x2="984" y2="270" stroke="#181818" stroke-width="1"/>
  <line x1="864" y1="240" x2="984" y2="240" stroke="#141414" stroke-width="1" stroke-dasharray="3,6"/>
  <line x1="864" y1="210" x2="984" y2="210" stroke="#141414" stroke-width="1" stroke-dasharray="3,6"/>

  <!-- Signal label -->
  <text x="864" y="286"
    font-family="'Inter',-apple-system,system-ui,sans-serif"
    font-size="8" letter-spacing="2.5" fill="#1c2c1c">SIGNAL FEED</text>

  <!-- Right geometric UI element -->
  <rect x="1086" y="96" width="90" height="156" rx="4"
    fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Inner target frame -->
  <rect x="1107" y="160" width="48" height="24" rx="3"
    fill="none" stroke="#00b4d8" stroke-width="0.75" opacity="0.22"/>

  <!-- Center node -->
  <circle cx="1131" cy="172" r="4" fill="#00b4d8" opacity="0.38"/>
  <circle cx="1131" cy="172" r="9" fill="none" stroke="#00b4d8" stroke-width="0.75" opacity="0.14"/>

  <!-- Horizontal connector to signal bars -->
  <line x1="1086" y1="172" x2="990" y2="172"
    stroke="#00b4d8" stroke-width="0.75" opacity="0.1"/>

  <!-- Crosshair tick marks -->
  <line x1="1131" y1="153" x2="1131" y2="158" stroke="#00b4d8" stroke-width="0.75" opacity="0.28"/>
  <line x1="1131" y1="186" x2="1131" y2="191" stroke="#00b4d8" stroke-width="0.75" opacity="0.28"/>
  <line x1="1116" y1="172" x2="1111" y2="172" stroke="#00b4d8" stroke-width="0.75" opacity="0.28"/>
  <line x1="1146" y1="172" x2="1151" y2="172" stroke="#00b4d8" stroke-width="0.75" opacity="0.28"/>

  <!-- Corner ticks on outer rect -->
  <line x1="1086" y1="110" x2="1096" y2="110" stroke="#252525" stroke-width="1"/>
  <line x1="1086" y1="238" x2="1096" y2="238" stroke="#252525" stroke-width="1"/>
  <line x1="1166" y1="110" x2="1176" y2="110" stroke="#252525" stroke-width="1"/>
  <line x1="1166" y1="238" x2="1176" y2="238" stroke="#252525" stroke-width="1"/>

  <!-- Bottom amber accent line -->
  <rect x="0" y="337" width="520" height="1" fill="#f59e0b" opacity="0.38"/>
  <circle cx="520" cy="337" r="1.5" fill="#f59e0b" opacity="0.38"/>
</svg>
