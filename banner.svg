 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
    <defs>
      <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
        <circle cx="0.5" cy="0.5" r="0.8" fill="#1c1c1c"/>
      </pattern>
      <linearGradient id="nameGrad" x1="56" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0%"  stop-color="#e2e8f0"/>
        <stop offset="75%" stop-color="#64748b"/>
      </linearGradient>
    </defs>

    <!-- ── Background ─────────────────────────────── -->
    <rect width="1200" height="320" fill="#0a0a0a"/>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <!-- Left cyan edge accent -->
    <rect x="0" y="0" width="2" height="320" fill="#00b4d8" opacity="0.35"/>

    <!-- ── Top-right status tag ───────────────────── -->
    <circle cx="1112" cy="22" r="3" fill="#22c55e" opacity="0.85"/>
    <text x="1122" y="26"
      font-family="'Inter',-apple-system,system-ui,sans-serif"
      font-size="10" letter-spacing="2.5" fill="#374151">ONLINE</text>
    <text x="1192" y="26" text-anchor="end"
      font-family="'Inter',-apple-system,system-ui,sans-serif"
      font-size="10" letter-spacing="1.5" fill="#f59e0b" opacity="0.4">v2025.1</text>

    <!-- ── Name ──────────────────────────────────── -->
    <text x="56" y="152"
      font-family="'Inter',-apple-system,system-ui,sans-serif"
      font-size="58" font-weight="700" letter-spacing="5"
      fill="url(#nameGrad)">AADIT PANI</text>

    <!-- Thin rule below name -->
    <line x1="56" y1="168" x2="340" y2="168" stroke="#222" stroke-width="1"/>

    <!-- ── Rotating phrases (cross-fade, 12s cycle) ─ -->

    <!-- PHRASE 1: 0s–4s -->
    <text x="60" y="200" opacity="0"
      font-family="'Inter',-apple-system,system-ui,sans-serif"
      font-size="15" letter-spacing="0.4" fill="#00b4d8">
      adaptive AI systems engineer
      <animate attributeName="opacity"
        values="0;1;1;0;0"
        keyTimes="0;0.042;0.292;0.333;1"
        dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- PHRASE 2: 4s–8s -->
    <text x="60" y="200" opacity="0"
      font-family="'Inter',-apple-system,system-ui,sans-serif"
      font-size="15" letter-spacing="0.4" fill="#00b4d8">
      building intelligent infrastructure
      <animate attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.333;0.375;0.625;0.667;1"
        dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- PHRASE 3: 8s–12s -->
    <text x="60" y="200" opacity="0"
      font-family="'Inter',-apple-system,system-ui,sans-serif"
      font-size="15" letter-spacing="0.4" fill="#00b4d8">
      edge inference architect
      <animate attributeName="opacity"
        values="0;0;0;1;1;0"
        keyTimes="0;0.667;0.708;0.958;1"
        dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- Blinking cursor (hard blink, not CSS) -->
    <text x="355" y="200"
      font-family="'Inter',-apple-system,system-ui,sans-serif"
      font-size="15" fill="#00b4d8">▋
      <animate attributeName="opacity"
        values="1;1;0;0;1"
        keyTimes="0;0.45;0.5;0.95;1"
        dur="1s" repeatCount="indefinite"/>
    </text>

    <!-- ── Context / subtitle line ───────────────── -->
    <text x="60" y="238"
      font-family="'Inter',-apple-system,system-ui,sans-serif"
      font-size="10.5" letter-spacing="2.8" fill="#2a3040">
      RVU · BENGALURU · EDGE AI · AUTONOMOUS SYSTEMS
    </text>

    <!-- ── Right side: live signal bars ──────────── -->
    <!-- All bars bottom-pinned at y=262 -->

    <!-- Bar 1 -->
    <rect x="870" y="242" width="7" height="20" rx="2" fill="#162116">
      <animate attributeName="y"      values="242;238;244;242" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="height" values="20;24;18;20"     dur="1.8s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 2 -->
    <rect x="884" y="230" width="7" height="32" rx="2" fill="#22c55e" opacity="0.18">
      <animate attributeName="y"      values="230;225;233;230" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="32;37;29;32"     dur="2.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 3 -->
    <rect x="898" y="217" width="7" height="45" rx="2" fill="#22c55e" opacity="0.26">
      <animate attributeName="y"      values="217;211;220;217" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="45;51;42;45"     dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 4 — peak (cyan) -->
    <rect x="912" y="202" width="7" height="60" rx="2" fill="#00b4d8" opacity="0.32">
      <animate attributeName="y"      values="202;196;206;202" dur="2.4s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="60;66;56;60"     dur="2.4s" begin="0.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 5 — peak (cyan) -->
    <rect x="926" y="197" width="7" height="65" rx="2" fill="#00b4d8" opacity="0.42">
      <animate attributeName="y"      values="197;190;202;197" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="height" values="65;72;60;65"     dur="1.9s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 6 -->
    <rect x="940" y="208" width="7" height="54" rx="2" fill="#00b4d8" opacity="0.28">
      <animate attributeName="y"      values="208;202;212;208" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="height" values="54;60;50;54"     dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 7 -->
    <rect x="954" y="222" width="7" height="40" rx="2" fill="#22c55e" opacity="0.22">
      <animate attributeName="y"      values="222;217;226;222" dur="1.7s" begin="0.15s" repeatCount="indefinite"/>
      <animate attributeName="height" values="40;45;36;40"     dur="1.7s" begin="0.15s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 8 -->
    <rect x="968" y="238" width="7" height="24" rx="2" fill="#162116">
      <animate attributeName="y"      values="238;233;241;238" dur="2.0s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="24;29;21;24"     dur="2.0s" begin="0.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar chart ground line + grid ticks -->
    <line x1="864" y1="262" x2="984" y2="262" stroke="#181818" stroke-width="1"/>
    <line x1="864" y1="232" x2="984" y2="232" stroke="#141414" stroke-width="1" stroke-dasharray="3,6"/>
    <line x1="864" y1="202" x2="984" y2="202" stroke="#141414" stroke-width="1" stroke-dasharray="3,6"/>

    <!-- Signal label -->
    <text x="864" y="278"
      font-family="'Inter',-apple-system,system-ui,sans-serif"
      font-size="8" letter-spacing="2.5" fill="#1c2c1c">SIGNAL FEED</text>

    <!-- ── Right geometric UI element ────────────── -->
    <rect x="1086" y="88" width="90" height="144" rx="4"
      fill="none" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Inner target frame -->
    <rect x="1107" y="148" width="48" height="24" rx="3"
      fill="none" stroke="#00b4d8" stroke-width="0.75" opacity="0.22"/>

    <!-- Center node -->
    <circle cx="1131" cy="160" r="4" fill="#00b4d8" opacity="0.38"/>
    <circle cx="1131" cy="160" r="9" fill="none" stroke="#00b4d8" stroke-width="0.75" opacity="0.14"/>

    <!-- Horizontal connector to signal bars -->
    <line x1="1086" y1="160" x2="990" y2="160"
      stroke="#00b4d8" stroke-width="0.75" opacity="0.1"/>

    <!-- Crosshair tick marks -->
    <line x1="1131" y1="141" x2="1131" y2="146" stroke="#00b4d8" stroke-width="0.75" opacity="0.28"/>
    <line x1="1131" y1="174" x2="1131" y2="179" stroke="#00b4d8" stroke-width="0.75" opacity="0.28"/>
    <line x1="1116" y1="160" x2="1111" y2="160" stroke="#00b4d8" stroke-width="0.75" opacity="0.28"/>
    <line x1="1146" y1="160" x2="1151" y2="160" stroke="#00b4d8" stroke-width="0.75" opacity="0.28"/>

    <!-- Corner ticks on outer rect -->
    <line x1="1086" y1="102" x2="1096" y2="102" stroke="#252525" stroke-width="1"/>
    <line x1="1086" y1="218" x2="1096" y2="218" stroke="#252525" stroke-width="1"/>
    <line x1="1166" y1="102" x2="1176" y2="102" stroke="#252525" stroke-width="1"/>
    <line x1="1166" y1="218" x2="1176" y2="218" stroke="#252525" stroke-width="1"/>

    <!-- ── Bottom amber accent line ──────────────── -->
    <rect x="0" y="317" width="520" height="1" fill="#f59e0b" opacity="0.38"/>
    <circle cx="520" cy="317" r="1.5" fill="#f59e0b" opacity="0.38"/>
  </svg>
