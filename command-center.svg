 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270">
    <defs>
      <linearGradient id="card" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
        <stop offset="0%" stop-color="#161616"/>
        <stop offset="100%" stop-color="#0c0c0c"/>
      </linearGradient>
    </defs>

    <!-- Root background -->
    <rect width="1200" height="270" fill="#0a0a0a"/>

    <!-- Header label -->
    <text x="2" y="19"
      font-family="'Courier New',Courier,monospace"
      font-size="10" font-weight="500" letter-spacing="4" fill="#374151">COMMAND CENTER</text>
    <text x="1198" y="19" text-anchor="end"
      font-family="'Courier New',Courier,monospace"
      font-size="9" letter-spacing="1.5" fill="#f59e0b" opacity="0.7">v2025.1 · NOMINAL</text>
    <line x1="0" y1="30" x2="1200" y2="30" stroke="#1c1c1c" stroke-width="1"/>


    <!-- ─────────────────────────────────────────── -->
    <!-- CARD 1 — SYSTEM STATUS  (x=0, w=380)       -->
    <!-- ─────────────────────────────────────────── -->
    <rect x="0" y="46" width="380" height="220" rx="6" fill="url(#card)" stroke="#242424" stroke-width="1"/>
    <rect x="0" y="46" width="36" height="2" rx="1" fill="#00b4d8" opacity="0.9"/>

    <text x="20" y="76"
      font-family="'Courier New',Courier,monospace"
      font-size="9" font-weight="600" letter-spacing="2.5" fill="#4b5563">SYSTEM STATUS</text>
    <line x1="20" y1="87" x2="360" y2="87" stroke="#1c1c1c" stroke-width="1"/>

    <text x="20"  y="112" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#3d4a5c">STATUS</text>
    <text x="110" y="112" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#e2e8f0">NOMINAL</text>
    <circle cx="355" cy="108" r="3.5" fill="#22c55e" opacity="0.9"/>

    <text x="20"  y="136" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#3d4a5c">UPTIME</text>
    <text x="110" y="136" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#e2e8f0">CONTINUOUS</text>

    <text x="20"  y="160" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#3d4a5c">MODE</text>
    <text x="110" y="160" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#e2e8f0">BUILDER</text>

    <text x="20"  y="184" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#3d4a5c">FOCUS</text>
    <text x="110" y="184" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#00b4d8">EDGE · INFERENCE · SYSTEMS</text>


    <!-- ─────────────────────────────────────────── -->
    <!-- CARD 2 — CURRENT OBJECTIVE  (x=410, w=380) -->
    <!-- ─────────────────────────────────────────── -->
    <rect x="410" y="46" width="380" height="220" rx="6" fill="url(#card)" stroke="#242424" stroke-width="1"/>
    <rect x="410" y="46" width="36" height="2" rx="1" fill="#f59e0b" opacity="0.9"/>

    <text x="430" y="76"
      font-family="'Courier New',Courier,monospace"
      font-size="9" font-weight="600" letter-spacing="2.5" fill="#4b5563">CURRENT OBJECTIVE</text>
    <line x1="430" y1="87" x2="770" y2="87" stroke="#1c1c1c" stroke-width="1"/>

    <!-- active items — amber pip -->
    <rect x="430" y="100" width="3" height="13" rx="1.5" fill="#f59e0b" opacity="0.85"/>
    <text x="444" y="111" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#d1d5db">Neuro-symbolic LLM guardrails</text>

    <rect x="430" y="124" width="3" height="13" rx="1.5" fill="#f59e0b" opacity="0.85"/>
    <text x="444" y="135" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#d1d5db">CUDA kernel optimization</text>

    <!-- queued items — graphite pip -->
    <rect x="430" y="148" width="3" height="13" rx="1.5" fill="#374151" opacity="0.9"/>
    <text x="444" y="159" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#6b7280">Edge inference pipeline arch</text>

    <rect x="430" y="172" width="3" height="13" rx="1.5" fill="#374151" opacity="0.9"/>
    <text x="444" y="183" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#6b7280">IDS anomaly detection models</text>


    <!-- ─────────────────────────────────────────── -->
    <!-- CARD 3 — SIGNAL  (x=820, w=380)            -->
    <!-- ─────────────────────────────────────────── -->
    <rect x="820" y="46" width="380" height="220" rx="6" fill="url(#card)" stroke="#242424" stroke-width="1"/>
    <rect x="820" y="46" width="36" height="2" rx="1" fill="#374151" opacity="0.9"/>

    <text x="840" y="76"
      font-family="'Courier New',Courier,monospace"
      font-size="9" font-weight="600" letter-spacing="2.5" fill="#4b5563">SIGNAL</text>
    <line x1="840" y1="87" x2="1180" y2="87" stroke="#1c1c1c" stroke-width="1"/>

    <text x="840"  y="112" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#3d4a5c">NODE</text>
    <text x="940"  y="112" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#e2e8f0">India</text>

    <text x="840"  y="136" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#3d4a5c">INSTITUTE</text>
    <text x="940"  y="136" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#e2e8f0">RVU, Bengaluru</text>

    <text x="840"  y="160" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#3d4a5c">TIMEZONE</text>
    <text x="940"  y="160" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#e2e8f0">UTC+05:30</text>

    <text x="840"  y="184" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#3d4a5c">SIGNAL</text>
    <text x="940"  y="184" font-family="'Inter',-apple-system,system-ui,sans-serif" font-size="11" fill="#22c55e">ACTIVE</text>
    <!-- Static concentric rings (CSS animations stripped by GitHub on img-served SVGs) -->
    <circle cx="1166" cy="180" r="4"  fill="#22c55e" opacity="0.9"/>
    <circle cx="1166" cy="180" r="8"  fill="none" stroke="#22c55e" stroke-width="1"   opacity="0.28"/>
    <circle cx="1166" cy="180" r="13" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.11"/>
  </svg>
